<!DOCTYPE html>
<html lang="en">
<head>

<title>Iron Front: Theater Command</title>
<style>
  :root { --bg:#0b1220; --panel:#131c2e; --line:#26344f; --text:#e6edf7; --mute:#8fa1bd; --accent:#4cc38a; --warn:#e0453a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; user-select:none; -webkit-user-select:none; }
  #cv { position:fixed; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  #panel canvas { vertical-align:middle; }
  #top { position:fixed; left:0; right:0; top:0; display:flex; gap:6px; align-items:center;
    padding:calc(env(safe-area-inset-top) + 6px) 8px 6px; background:rgba(11,18,32,.92); border-bottom:1px solid var(--line); z-index:5; }
  #top .stat { font-weight:600; white-space:nowrap; }
  #top .grow { flex:1; }
  button { font:inherit; color:var(--text); background:#1e2a42; border:1px solid #31425f; border-radius:9px; padding:7px 10px; cursor:pointer; }
  button:active { transform:translateY(1px); }
  button.primary { background:#1f7a52; border-color:#2a9b69; font-weight:600; }
  button.danger { background:#7a2420; border-color:#a5332d; }
  button:disabled { opacity:.45; }
  #panel { position:fixed; left:0; right:0; bottom:0; max-height:46vh; overflow:auto; z-index:5;
    background:rgba(19,28,46,.96); border-top:1px solid var(--line); padding:10px 10px calc(env(safe-area-inset-bottom) + 10px); }
  #panel:empty { display:none; }
  #panel h3 { margin:0 0 4px; font-size:16px; display:flex; align-items:center; gap:8px; }
  #panel .sub { color:var(--mute); font-size:12.5px; margin-bottom:6px; }
  .row { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:6px; margin-top:6px; }
  .bcard { display:flex; flex-direction:column; align-items:flex-start; gap:1px; padding:6px 8px; text-align:left; }
  .bcard small { color:var(--mute); font-size:11px; }
  .dot { width:12px; height:12px; border-radius:50%; display:inline-block; border:1px solid #0008; }
  .pill { display:inline-block; padding:1px 7px; border-radius:99px; background:#24324d; font-size:12px; color:var(--mute); margin-right:4px; }

  #modal { position:fixed; inset:0; z-index:10; background:rgba(5,9,18,.82); display:flex; align-items:center; justify-content:center; padding:14px; }
  #modal.hidden { display:none; }

  .seg { display:flex; gap:6px; flex-wrap:wrap; }

  .tech { border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin-bottom:6px; display:flex; gap:10px; align-items:center; }

  #toast { position:fixed; left:50%; top:calc(env(safe-area-inset-top) + 56px); transform:translateX(-50%); z-index:8; pointer-events:none;
    display:flex; flex-direction:column; gap:4px; align-items:center; width:92%; }
  #toast div { background:rgba(19,28,46,.95); border:1px solid var(--line); padding:6px 12px; border-radius:99px; font-size:13px; animation:fade 3.2s forwards; text-align:center; }
  @keyframes fade { 0%{opacity:0;transform:translateY(-6px)} 8%{opacity:1;transform:none} 80%{opacity:1} 100%{opacity:0} }
  #zoom { position:fixed; right:8px; z-index:4; display:flex; flex-direction:column; gap:6px; top:calc(env(safe-area-inset-top) + 58px); }
  #zoom button { width:38px; height:38px; padding:0; font-size:18px; }
  #busy { position:fixed; left:8px; top:calc(env(safe-area-inset-top) + 58px); z-index:4; padding:5px 10px; border-radius:99px; background:#2a1414; border:1px solid #6b2a26; font-size:12.5px; display:none; }
  p { margin:6px 0; }

<body>
<canvas id="cv"></canvas>
<div id="top">

<script>
'use strict';
/* =========================================================
   IRON FRONT: THEATER COMMAND
   An original turn-based modern-warfare strategy game.
   Author: 🎯
   ========================================================= */

const HEX = 30, SQ3 = Math.sqrt(3);
const PCOL = ['#2f7de1', '#e0453a', '#e8a317', '#9b4fd6'];
const PNAME = ['Blue Coalition', 'Red Pact', 'Gold Union', 'Violet Bloc'];
const TOWN_NAMES = ['Kessel','Ardena','Vostrel','Marrow','Halden','Tarsk','Bresk','Olvan','Corva','Dunmere','Esker','Fallow',
  'Garnet','Hollis','Iver','Jarrow','Kirin','Lomax','Mirov','Norrland','Osk','Pell','Quorin','Rask','Sable','Tamsin','Ulric',
  'Varga','Wexley','Yarrow','Zenda','Arlo','Brennan','Calder','Drava','Elgin','Ferris','Grosvald','Harlan','Istra','Juno',
  'Kestrel','Linden','Morrow','Nessa','Orrin','Pavla','Ridge','Stellan','Torvik'];

const TERRAIN = {
  plain:    { name:'Plains',        color:'#7fae62', def:1,    land:true  },
  forest:   { name:'Forest',        color:'#4f8042', def:1.25, land:true  },
  hill:     { name:'Hills',         color:'#a99d62', def:1.5,  land:true  },
  mountain: { name:'Mountains',     color:'#8c8f94', def:2,    land:true  },
  shallow:  { name:'Coastal Water', color:'#4c9fc6', def:1,    land:false },
  ocean:    { name:'Deep Ocean',    color:'#215f8f', def:1,    land:false },
};

// air: damage multiplier vs aircraft (0 = cannot hit air). ground: multiplier vs surface targets (default 1).
const UNITS = {
  infantry:  { name:'Infantry',        cost:2,  hp:10, atk:2,   def:2,   mv:1, rng:1, vis:2, dom:'land',  req:null,        cap:true, air:0.5,
               desc:'Cheap and steady. Captures cities. Can fire at low aircraft.' },
  recon:     { name:'Recon Jeep',      cost:3,  hp:10, atk:1.5, def:1,   mv:3, rng:1, vis:3, dom:'land',  req:'motor',     cap:true,
               desc:'Fast scout with wide vision. Captures cities.' },
  tank:      { name:'Battle Tank',     cost:8,  hp:20, atk:4,   def:3.5, mv:2, rng:1, vis:2, dom:'land',  req:'armor',     cap:true, heavy:true,
               desc:'Heavy armor. Cannot cross mountains or hit aircraft.' },
  artillery: { name:'Artillery',       cost:7,  hp:10, atk:4,   def:1,   mv:1, rng:3, minr:2, vis:2, dom:'land', req:'artillery', heavy:true,
               desc:'Shells targets 2–3 tiles away. Helpless up close.' },
  aa:        { name:'AA Battery',      cost:6,  hp:14, atk:2,   def:2.5, mv:1, rng:2, vis:3, dom:'land',  req:'artillery', heavy:true, air:2.5,
               desc:'Shreds aircraft within 2 tiles.' },
  destroyer: { name:'Destroyer',       cost:8,  hp:18, atk:3,   def:3,   mv:3, rng:2, vis:3, dom:'naval', req:'naval',     air:1, sonar:true,
               desc:'Fires 2 tiles. Sonar reveals subs within 2.' },
  submarine: { name:'Submarine',       cost:9,  hp:12, atk:5,   def:1.5, mv:3, rng:1, vis:2, dom:'naval', req:'subs',      stealth:true,
               desc:'Invisible unless an enemy is adjacent or a destroyer is near.' },
  fighter:   { name:'Fighter Jet',     cost:10, hp:14, atk:3,   def:3,   mv:5, rng:1, vis:3, dom:'air',   req:'aviation',  air:2, ground:0.5,
               desc:'Air superiority. Flies over anything. Weak vs ground.' },
  bomber:    { name:'Bomber',          cost:12, hp:14, atk:5,   def:1,   mv:4, rng:1, vis:2, dom:'air',   req:'bombing',   air:0,
               desc:'Devastating vs ground and ships. Defenseless vs fighters.' },
  satellite: { name:'Recon Satellite', cost:14, hp:1,  atk:0,   def:0,   mv:4, rng:0, vis:5, dom:'orbit', req:'space',
               desc:'In orbit: cannot be attacked. Huge vision. After 2 turns it can be upgraded.' },
  strikesat: { name:'Strike Satellite',cost:8,  hp:1,  atk:5,   def:0,   mv:3, rng:1, minr:0, vis:5, dom:'orbit', req:'orbital', noBuild:true,
               desc:'Orbital strike on a tile at or next to it. Recharges for 2 turns.' },
};

const TECH = {
  motor:     { name:'Motor Pool',        base:4,  req:[],                     unlock:'Recon Jeep' },
  armor:     { name:'Armored Warfare',   base:7,  req:['motor'],              unlock:'Battle Tank' },
  artillery: { name:'Fire Support',      base:6,  req:[],                     unlock:'Artillery, AA Battery' },
  industry:  { name:'Oil Industry',      base:5,  req:[],                     unlock:'Oil Derricks (+2 ⛽/turn)' },
  naval:     { name:'Naval Command',     base:5,  req:[],                     unlock:'Destroyer (coastal cities)' },
  subs:      { name:'Submarine Warfare', base:7,  req:['naval'],              unlock:'Submarine' },
  aviation:  { name:'Air Force',         base:8,  req:['motor'],              unlock:'Fighter Jet' },
  bombing:   { name:'Strategic Bombing', base:9,  req:['aviation'],           unlock:'Bomber' },
  space:     { name:'Space Program',     base:12, req:['aviation','industry'],unlock:'Recon Satellite' },
  orbital:   { name:'Orbital Weapons',   base:10, req:['space'],              unlock:'Upgrade satellites to Strike Satellites' },
};

const DIRS = [[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]]; // axial, pointy-top: E, SE, SW, W, NW, NE
const DERRICK_COST = 5, UPGRADE_COST = 8, MAX_SATS = 2, MAX_LEVEL = 5;

/* ---------------- state ---------------- */
let S = null;               // full game state (serialisable)
let visCache = {}, fieldCache = new Map();
let sel = null;             // {kind:'unit'|'city'|'tile', id, i}
let reach = new Map(), tgts = [], pending = null;
let busy = false, dirty = true;
const floats = [];
const cam = { x:0, y:0, z:1 };

const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------------- hex helpers ---------------- */
const idx = (c, r) => r * S.w + c;
const tileAt = (c, r) => (c < 0 || r < 0 || c >= S.w || r >= S.h) ? null : S.tiles[idx(c, r)];
const toAxial = (c, r) => [c - ((r - (r & 1)) >> 1), r];
const fromAxial = (q, r) => [q + ((r - (r & 1)) >> 1), r];
function neighbors(t) {
  const [q, r] = toAxial(t.c, t.r), out = [];
  for (const [dq, dr] of DIRS) { const [nc, nr] = fromAxial(q + dq, r + dr); out.push(tileAt(nc, nr)); }
  return out;
}
function dist(a, b) {
  const [q1, r1] = toAxial(a.c, a.r), [q2, r2] = toAxial(b.c, b.r);
  const dq = q1 - q2, dr = r1 - r2;
  return (Math.abs(dq) + Math.abs(dr) + Math.abs(dq + dr)) / 2;
}
function within(t, rad) {
  const out = [];
  for (let r = Math.max(0, t.r - rad); r <= Math.min(S.h - 1, t.r + rad); r++)
    for (let c = Math.max(0, t.c - rad - 1); c <= Math.min(S.w - 1, t.c + rad + 1); c++) {
      const x = S.tiles[idx(c, r)]; if (dist(t, x) <= rad) out.push(x);
    }
  return out;
}
const hexPos = (c, r) => [HEX * SQ3 * (c + 0.5 * (r & 1)) + HEX, HEX * 1.5 * r + HEX];

/* ---------------- lookups ---------------- */
const tileOf = o => S.tiles[idx(o.c, o.r)];
const layerOf = u => UNITS[u.type].dom === 'orbit' ? 'orbit' : 'surface';
const unitById = id => S.units.find(u => u.id === id);
function unitAt(t, layer = 'surface') { return S.units.find(u => u.c === t.c && u.r === t.r && layerOf(u) === layer) || null; }
const cityAt = t => t.city >= 0 ? S.cities[t.city] : null;
const citiesOf = p => S.cities.filter(c => c.owner === p);
const unitsOf = p => S.units.filter(u => u.owner === p);
const ownerOf = t => t.claim >= 0 ? S.cities[t.claim].owner : -1;
const isWater = t => !TERRAIN[t.t].land;
const isCoastal = city => neighbors(tileOf(city)).some(n => n && isWater(n));
const has = (p, k) => S.players[p].tech.includes(k);
const bump = () => { S.ver++; dirty = true; };

function income(p) {
  let s = 0;
  for (const c of citiesOf(p)) s += 1 + c.level + (c.capital ? 2 : 0);
  for (const t of S.tiles) if (t.derrick && ownerOf(t) === p) s += 2;
  if (S.players[p].ai) s += S.aiBonus;
  return s;
}
const unitCap = p => citiesOf(p).reduce((a, c) => a + c.level + 1, 0);
const unitCount = p => unitsOf(p).filter(u => UNITS[u.type].dom !== 'orbit').length;
const techCost = (p, k) => TECH[k].base + 2 * Math.max(0, citiesOf(p).length - 1);
const expandCost = c => 4 * c.level;
const techReady = (p, k) => TECH[k].req.every(r => has(p, r));

/* ---------------- map generation ---------------- */
function makeNoise(w, h, cell) {
  const gw = Math.ceil(w / cell) + 3, gh = Math.ceil(h / cell) + 3, g = [];
  for (let i = 0; i < gw * gh; i++) g.push(Math.random());
  return (x, y) => {
    const fx = x / cell, fy = y / cell, x0 = Math.floor(fx), y0 = Math.floor(fy);
    const tx = fx - x0, ty = fy - y0, sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
    const v = (a, b) => g[b * gw + a];
    const a = v(x0, y0) * (1 - sx) + v(x0 + 1, y0) * sx, b = v(x0, y0 + 1) * (1 - sx) + v(x0 + 1, y0 + 1) * sx;
    return a * (1 - sy) + b * sy;
  };
}

function generate(w, h, nPlayers) {
  for (let attempt = 0; attempt < 60; attempt++) {
    S.tiles = []; S.cities = [];
    const n1 = makeNoise(w, h, 5), n2 = makeNoise(w, h, 2.2), n3 = makeNoise(w, h, 3);
    const elev = [];
    for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) {
      const x = c + 0.5 * (r & 1), y = r * 0.866;
      let e = n1(x, y) * 0.65 + n2(x, y) * 0.35;
      const edge = Math.min(1, Math.min(c + 1, w - c, r + 1, h - r) / 3);
      e *= 0.5 + 0.5 * edge;
      elev.push(e);
      S.tiles.push({ c, r, i: r * w + c, t:'plain', oil:false, derrick:false, city:-1, claim:-1, f: n3(x, y) });
    }
    const sorted = [...elev].sort((a, b) => a - b), N = elev.length;
    const water = sorted[Math.floor(N * 0.38)], hill = sorted[Math.floor(N * 0.85)], mtn = sorted[Math.floor(N * 0.95)];
    for (const t of S.tiles) {
      const e = elev[t.i];
      t.t = e < water ? 'ocean' : e >= mtn ? 'mountain' : e >= hill ? 'hill' : t.f > 0.6 ? 'forest' : 'plain';
    }
    for (const t of S.tiles) if (t.t === 'ocean' && neighbors(t).some(n => n && TERRAIN[n.t].land)) t.t = 'shallow';
    // largest land mass
    const seen = new Uint8Array(N); let best = [];
    for (const t of S.tiles) {
      if (seen[t.i] || !TERRAIN[t.t].land) continue;
      const comp = [], st = [t]; seen[t.i] = 1;
      while (st.length) { const x = st.pop(); comp.push(x); for (const n of neighbors(x)) if (n && !seen[n.i] && TERRAIN[n.t].land) { seen[n.i] = 1; st.push(n); } }
      if (comp.length > best.length) best = comp;
    }
    const landCount = S.tiles.filter(t => TERRAIN[t.t].land).length;
    if (best.length < landCount * 0.55 || best.length < nPlayers * 14) continue;
    // capitals: farthest-point sampling
    const cand = best.filter(t => t.t !== 'mountain');
    const caps = [pick(cand)];
    while (caps.length < nPlayers) {
      let bt = null, bd = -1;
      for (const t of cand) { const d = Math.min(...caps.map(c => dist(c, t))); if (d > bd) { bd = d; bt = t; } }
      caps.push(bt);
    }
    // re-pick the first one farthest from others too
    const minSep = Math.min(...caps.flatMap((a, i) => caps.slice(i + 1).map(b => dist(a, b))));
    if (minSep < Math.max(4, Math.floor(Math.min(w, h) / 3))) continue;
    const names = shuffle([...TOWN_NAMES]);
    const addCity = (t, owner, capital) => {
      const id = S.cities.length;
      S.cities.push({ id, c:t.c, r:t.r, name:names[id % names.length], owner, level: capital ? 2 : 1, capital, built:false });
      t.city = id; if (t.t === 'mountain' || t.t === 'forest') t.t = 'plain';
    };
    shuffle(caps).forEach((t, p) => addCity(t, p, true));
    const target = Math.round(landCount / 12);
    for (const t of shuffle(S.tiles.filter(t => TERRAIN[t.t].land && t.t !== 'mountain'))) {
      if (S.cities.length >= nPlayers + target) break;
      if (S.cities.every(c => dist(c, t) >= 3)) addCity(t, -1, false);
    }
    for (const t of S.tiles) if ((t.t === 'plain' || t.t === 'hill') && t.city < 0 && Math.random() < 0.09) t.oil = true;
    for (const t of S.tiles) delete t.f;
    return true;
  }
  return false;
}

function recomputeTerritory() {
  for (const t of S.tiles) t.claim = -1;
  const order = [...S.cities].sort((a, b) => (b.capital - a.capital) || (b.level - a.level));
  for (const c of order) for (const t of within(tileOf(c), c.level >= 3 ? 2 : 1)) if (t.claim < 0 && (t.city < 0 || t.city === c.id)) t.claim = c.id;
}

/* ---------------- new game / save ---------------- */
function newGame(opts) {
  const n = opts.ai + 1, size = opts.size;
  S = { w:size, h:size, tiles:[], cities:[], units:[], players:[], turn:1, cur:0, ver:1, nextId:1,
        explored:[], spectate: !!opts.spectate, aiBonus: [0, 1, 3][opts.diff], over:false, log:[] };
  if (!generate(size, size, n)) { alert('Map generation failed, try again'); return; }
  for (let p = 0; p < n; p++) {
    S.players.push({ id:p, name:PNAME[p], color:PCOL[p], ai: p > 0 || !!opts.spectate, supply:5, tech:[], alive:true,
                     order: shuffle(Object.keys(TECH)).sort((a, b) => TECH[a].base - TECH[b].base + rand(-4, 4)) });
  }
  S.explored = new Array(S.tiles.length).fill(0);
  recomputeTerritory();
  for (const c of S.cities) if (c.capital) {
    const spot = neighbors(tileOf(c)).find(n => n && TERRAIN[n.t].land && n.t !== 'mountain' && n.city < 0) || tileOf(c);
    spawn('infantry', c.owner, spot, false);
  }
  visCache = {}; sel = null; clearSel();
  centerOn(tileOf(S.cities.find(c => c.capital && c.owner === 0)));
  closeModal();
  startTurn(0);
  if (S.players[0].ai) runAI();
}

function save() { if (!S || S.over || S.spectate) return; try { localStorage.setItem('ironfront_save', JSON.stringify(S)); } catch (e) {} }
function load() {
  try { const s = JSON.parse(localStorage.getItem('ironfront_save')); if (!s) return false;
    S = s; visCache = {}; fieldCache.clear(); clearSel();
    centerOn(tileOf(S.cities.find(c => c.owner === 0) || S.cities[0])); closeModal(); refreshUI(); return true;
  } catch (e) { return false; }
}

/* ---------------- visibility ---------------- */
function getVis(p) {
  const c = visCache[p]; if (c && c.ver === S.ver) return c.set;
  const set = new Set();
  for (const u of S.units) if (u.owner === p) {
    const t = tileOf(u), U = UNITS[u.type];
    for (const x of within(t, U.vis + (U.dom === 'land' && t.t === 'mountain' ? 1 : 0))) set.add(x.i);
  }
  for (const ct of S.cities) if (ct.owner === p) for (const x of within(tileOf(ct), ct.level >= 3 ? 3 : 2)) set.add(x.i);
  visCache[p] = { ver:S.ver, set }; return set;
}
function seesUnit(p, u) {
  if (u.owner === p) return true;
  if (S.spectate && p === 0) return true;
  if (!getVis(p).has(idx(u.c, u.r))) return false;
  if (UNITS[u.type].stealth && !cityAt(tileOf(u))) {
    return S.units.some(o => o.owner === p && layerOf(o) === 'surface' &&
      (dist(o, u) <= 1 || (UNITS[o.type].sonar && dist(o, u) <= 2)));
  }
  return true;
}
function updateExplored() {
  if (S.spectate) return;
  for (const i of getVis(0)) S.explored[i] = 1;
}

/* ---------------- movement ---------------- */

    const u = unitById(sel.id); if (!u) { panel.innerHTML = ''; return; }
    const U = UNITS[u.type], P = S.players[u.owner];
    h += `<h3><span id="picon"></span>${U.name} <small style="color:${P.color}">${P.name}</small></h3>`;
    h += `<div class="sub">${U.desc}</div>`;
    if (U.dom !== 'orbit') h += `<span class="pill">HP ${u.hp}/${U.hp}</span>`;
    h += statLine(U);
    if (u.type === 'strikesat' && u.cd) h += `<span class="pill">Recharging ${u.cd}</span>`;
    if (u.owner === 0 && myTurn) {
      const status = u.attacked ? 'Done for this turn' : u.moved ? (tgts.length ? 'Moved — can still attack' : 'Moved') : 'Ready';
      h += `<div class="sub" style="margin-top:6px">${status}${!u.moved && reach.size ? ' · tap a highlighted tile to move' : ''}${tgts.length ? ' · tap a red ring to target' : ''}</div>`;
      h += '<div class="row">';
      if (canCapture(u)) h += `<button class="primary" data-a="capture">🚩 Capture ${cityAt(tileOf(u)).name}</button>`;
      else { const c = cityAt(tileOf(u)); if (c && c.owner !== 0 && UNITS[u.type].cap && !u.attacked && c.owner >= 0) h += `<span class="sub">Hold this city until next turn to capture it.</span>`; }
      if (u.type === 'satellite') h += `<button data-a="upgrade" ${canUpgrade(u) ? '' : 'disabled'}>☄️ Arm satellite (${UPGRADE_COST} ⛽)${!has(0, 'orbital') ? ' — needs Orbital Weapons' : u.age < 2 ? ' — after 2 turns in orbit' : ''}</button>`;
      if (!u.attacked) h += `<button data-a="hold">💤 Hold</button>`;
      h += '</div>';
      if (pending) {
        const r = calcCombat(u, pending), E = UNITS[pending.type];
        h += `<div class="preview"><b>Attack ${S.players[pending.owner].name} ${E.name}</b><br>
              Deal <b style="color:#ff6b5e">${r.dmg}</b> (enemy HP ${pending.hp}${r.dmg >= pending.hp ? ' → destroyed' : ''}) · Take <b style="color:#ffb35e">${r.counter}</b>
              <div class="row"><button class="danger" data-a="attack">💥 Confirm attack</button><button data-a="cancel">Cancel</button></div>
              <div class="sub">Tip: tap the target again to fire.</div></div>`;
      }
    }
  } else if (sel.kind === 'city') {
    const c = S.cities[sel.id], own = c.owner === 0;
    const P = c.owner >= 0 ? S.players[c.owner] : null;
    h += `<h3>${c.capital ? '⭐ ' : '🏙 '}${c.name} <small style="color:${P ? P.color : '#aaa'}">${P ? P.name : 'Neutral'}</small></h3>`;
    h += `<span class="pill">Level ${c.level}</span><span class="pill">+${1 + c.level + (c.capital ? 2 : 0)} ⛽/turn</span>`;
    if (isCoastal(c)) h += `<span class="pill">⚓ Port</span>`;
    if (own) {
      h += `<span class="pill">Units ${unitCount(0)}/${unitCap(0)}</span>`;
      if (myTurn) {
        h += `<div class="row">${c.level < MAX_LEVEL ? `<button data-a="expand" ${S.players[0].supply >= expandCost(c) ? '' : 'disabled'}>🏗 Expand city (${expandCost(c)} ⛽) — +1 ⛽, +1 unit cap${c.level === 2 ? ', bigger territory' : ''}</button>` : '<span class="sub">Max level</span>'}</div>`;
        h += `<div class="sub" style="margin-top:8px">Build (one per city per turn):</div><div class="grid">`;
        for (const k of Object.keys(UNITS)) {
          const U = UNITS[k]; if (U.noBuild) continue;
          if (U.dom === 'naval' && !isCoastal(c)) continue;
          const why = buildReason(0, c, k);
          h += `<button class="bcard" data-a="build" data-k="${k}" ${why ? 'disabled' : ''}><span>${U.name}</span><small>${U.cost} ⛽ · ${why || 'Ready'}</small></button>`;
        }
        h += '</div>';
      }
    } else h += `<div class="sub" style="margin-top:6px">Move a capturing unit (Infantry, Recon, Tank) here to take it. Neutral towns are captured right away; enemy cities must be held for a turn.</div>`;
  } else {
    const t = S.tiles[sel.id], o = ownerOf(t);
    h += `<h3>${TERRAIN[t.t].name}</h3>`;
    h += `<span class="pill">Defense ×${TERRAIN[t.t].def}</span>`;
    h += `<span class="pill">${o >= 0 ? S.players[o].name + ' territory' : 'Unclaimed'}</span>`;
    if (t.oil) h += `<span class="pill">${t.derrick ? '🛢 Derrick (+2 ⛽)' : '🛢 Oil field'}</span>`;
    if (t.oil && !t.derrick && o === 0 && myTurn)
      h += `<div class="row"><button data-a="derrick" ${canDerrick(0, t) ? '' : 'disabled'}>🛢 Build derrick (${DERRICK_COST} ⛽)${has(0, 'industry') ? '' : ' — needs Oil Industry'}</button></div>`;
    const moveInfo = { plain:'Move cost 1', forest:'Move cost 2', hill:'Move cost 2', mountain:'Move cost 3 · no heavy vehicles', shallow:'Ships only', ocean:'Ships only' };
    h += `<div class="sub" style="margin-top:6px">${moveInfo[t.t]}. Aircraft and satellites ignore terrain.</div>`;
  }
  panel.innerHTML = h;
  if (sel.kind === 'unit') { const u = unitById(sel.id); const pi = $('picon'); if (u && pi) pi.replaceWith(iconCanvas(u.type, S.players[u.owner].color, 30)); }
}
panel.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled || busy) return;
  const a = b.dataset.a;
  if (sel.kind === 'unit') {
    const u = unitById(sel.id); if (!u) return;
    if (a === 'capture') { capture(u); afterAction(u); }
    else if (a === 'upgrade') { upgrade(u); afterAction(u); }
    else if (a === 'hold') { u.moved = u.attacked = true; afterAction(u); nextUnit(); }
    else if (a === 'attack' && pending) { doAttack(u, pending); afterAction(u); }
    else if (a === 'cancel') { pending = null; dirty = true; refreshPanel(); }
  } else if (sel.kind === 'city') {
    const c = S.cities[sel.id];
    if (a === 'expand') { expand(0, c); refreshUI(); }
    if (a === 'build') { const u = build(0, c, b.dataset.k); if (u) toast(`${UNITS[u.type].name} deployed in ${c.name} — ready next turn`); refreshUI(); }
  } else if (a === 'derrick') { buildDerrick(0, S.tiles[sel.id]); refreshUI(); }
});
function nextUnit() {
  const ready = unitsOf(0).filter(u => !u.moved || (!u.attacked && targetsFrom(u).length));
  if (!ready.length) { toast('All units have acted — end your turn when ready'); return; }
  let i = 0;
  if (sel && sel.kind === 'unit') { const j = ready.findIndex(u => u.id === sel.id); if (j >= 0) i = (j + 1) % ready.length; }
  selectUnit(ready[i]); centerOn(tileOf(ready[i]));
}
$('bEnd').onclick = endTurn;
$('bNext').onclick = () => { if (!busy) nextUnit(); };
$('bTech').onclick = () => { if (!busy) showTech(); };
$('bMenu').onclick = () => showMenu();

/* ---------------- modals ---------------- */
const modal = $('modal'), mbox = $('mbox');
function openModal(html) { mbox.innerHTML = html; modal.classList.remove('hidden'); }
function closeModal() { modal.classList.add('hidden'); }
modal.addEventListener('click', e => { if (e.target === modal && S && !S.over) closeModal(); });

function showTech() {
  const P = S.players[0];
  let h = `<h1>🔬 Research</h1><div class="sub">You have ⛽ ${P.supply}. Costs rise as your empire grows.</div><h2>Doctrines</h2>`;
  for (const k of Object.keys(TECH)) {
    const T = TECH[k], owned = has(0, k), ready = techReady(0, k), cost = techCost(0, k);
    h += `<div class="tech ${owned ? 'owned' : ''}"><div class="info"><b>${T.name}</b><small>Unlocks: ${T.unlock}${T.req.length ? ' · Requires ' + T.req.map(r => TECH[r].name).join(' + ') : ''}</small></div>`;
    h += owned ? '✅' : `<button data-t="${k}" ${ready && P.supply >= cost && S.cur === 0 ? '' : 'disabled'}>${ready ? cost + ' ⛽' : '🔒'}</button>`;
    h += '</div>';
  }
  h += `<div class="row"><button id="mClose">Close</button></div>`;
  openModal(h);
  mbox.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { if (research(0, b.dataset.t)) { toast(`${TECH[b.dataset.t].name} researched`); refreshUI(); showTech(); } });
  $('mClose').onclick = closeModal;
}

const HELP = `
<h2>Goal</h2><p>Capture every enemy city. A faction with no cities is out.</p>
<h2>Each turn</h2><ul>
<li>You earn <b>⛽ Supply</b> from your cities (and oil derricks).</li>
<li>Tap a <b>unit</b>: white tiles show where it can move, red rings show what it can hit. Tap a ring to preview, tap again to fire.</li>
<li>A unit can move then attack. Attacking ends its turn.</li>
<li>Tap a <b>city</b> to build units (one per city per turn) or expand it.</li>
<li>Tap 🔬 to research new doctrines: tanks, artillery, navy, air force and space.</li></ul>
<h2>Combat</h2><ul>
<li>Damage depends on attack vs defense and remaining HP. Survivors fire back if they can reach.</li>
<li>Forest ×1.25, hills ×1.5, mountains ×2, own city ×1.5 defense.</li>
<li>Only Infantry, AA, Fighters and Destroyers can hit aircraft.</li>
<li>Submarines are invisible until an enemy is adjacent or a Destroyer is within 2 tiles.</li>
<li>Satellites sit in orbit: nothing can shoot them. Research Orbital Weapons to arm them.</li>
<li>Moving next to an enemy ground or naval unit stops your movement.</li>
<li>Units that don't act heal next turn (most in your own cities).</li></ul>
<h2>Capturing</h2><p>Infantry, Recon and Tanks capture. Neutral towns fall at once; enemy cities must be held into your next turn.</p>
<h2>Controls</h2><p>Drag to pan, pinch or +/− to zoom. Tap a tile again to cycle between unit, satellite, city and terrain.</p>`;

let setup = { ai:2, size:16, diff:1 };
function showStart() {
  const hasSave = !!localStorage.getItem('ironfront_save');
  const seg = (key, vals) => `<div class="seg">${vals.map(([v, l]) => `<button data-s="${key}" data-v="${v}" class="${setup[key] === v ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  openModal(`<h1>🪖 Iron Front</h1><div class="sub">Theater Command — a turn-based modern warfare strategy game.</div>
    <p>Build an army of infantry, tanks, artillery, destroyers, submarines, jets and bombers. Race to space and put a satellite in orbit. Take every enemy city to win.</p>
    <h2>Opponents</h2>${seg('ai', [[1, '1'], [2, '2'], [3, '3']])}
    <h2>Map size</h2>${seg('size', [[12, 'Small'], [16, 'Medium'], [22, 'Large']])}
    <h2>Difficulty</h2>${seg('diff', [[0, 'Recruit'], [1, 'Veteran'], [2, 'General']])}
    <div class="row" style="margin-top:16px"><button class="primary" id="mStart">▶ New game</button>${hasSave ? '<button id="mCont">Continue saved game</button>' : ''}<button id="mHelp">How to play</button><button id="mWatch">Watch AIs fight</button></div>`);
  mbox.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { setup[b.dataset.s] = +b.dataset.v; showStart(); });
  $('mStart').onclick = () => newGame(setup);
  if (hasSave) $('mCont').onclick = () => { if (!load()) toast('Could not load save'); };
  $('mHelp').onclick = () => { openModal(`<h1>How to play</h1>${HELP}<div class="row"><button id="mBack">Back</button></div>`); $('mBack').onclick = S && !S.over ? closeModal : showStart; };
  $('mWatch').onclick = () => newGame({ ...setup, ai: Math.max(1, setup.ai), spectate:true });
}
function showMenu() {
  if (!S) return showStart();
  openModal(`<h1>Menu</h1><div class="sub">Turn ${S.turn} · ${S.players.filter(p => p.alive).length} factions remain</div>
    ${S.players.map(p => `<div class="tech"><span class="dot" style="background:${p.color}"></span><div class="info"><b>${p.name}${p.id === 0 && !S.spectate ? ' (you)' : ''}</b><small>${p.alive ? `${citiesOf(p.id).length} cities · ${unitsOf(p.id).length} units · ${p.tech.length} doctrines` : 'Eliminated'}</small></div></div>`).join('')}
    <div class="row"><button id="mResume" class="primary">Resume</button><button id="mHelp2">How to play</button><button id="mNew" class="danger">New game</button></div>`);
  $('mResume').onclick = closeModal;
  $('mHelp2').onclick = () => { openModal(`<h1>How to play</h1>${HELP}<div class="row"><button id="mBack">Back</button></div>`); $('mBack').onclick = closeModal; };
  $('mNew').onclick = () => { if (!S.over && !S.spectate && !confirm('Abandon this game?')) return; S.over = true; showStart(); };
}
function gameOver(win, winner) {
  S.over = true; busy = false; showBusy(''); localStorage.removeItem('ironfront_save'); refreshUI();
  const title = S.spectate ? `${winner ? winner.name + ' wins' : 'Stalemate'}` : win ? '🏆 Victory!' : '☠️ Defeat';
  const msg = S.spectate ? `The war ended on turn ${S.turn}.` : win ? `You conquered the theater in ${S.turn} turns.` : 'Your last city has fallen.';
  openModal(`<h1>${title}</h1><p>${msg}</p><div class="row"><button class="primary" id="mAgain">New game</button><button id="mLook">View map</button></div>`);
  $('mAgain').onclick = showStart; $('mLook').onclick = closeModal;
}

// expose for testing
window.__game = { get S() { return S; }, newGame, endTurn, UNITS, TECH, setFast: v => { if (S) S.fastAI = v; } };

showStart();
</script>
</body>
</html>
