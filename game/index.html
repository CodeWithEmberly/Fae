<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="author" content="🎯">
<meta name="theme-color" content="#0b1220">
<title>Iron Front</title>
<style>
  :root { color-scheme:dark; --bg:#0b1220; --panel:#131c2e; --line:#26344f; --text:#e6edf7; --mute:#8fa1bd; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; user-select:none; -webkit-user-select:none; }
  #cv { position:fixed; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  #panel canvas { vertical-align:middle; }
  #top { position:fixed; left:0; right:0; top:0; display:flex; gap:6px; align-items:center;
    padding:calc(env(safe-area-inset-top) + 6px) 8px 6px; background:rgba(11,18,32,.92); border-bottom:1px solid var(--line); z-index:5; }
  #top .stat { font-weight:600; white-space:nowrap; font-size:13px; }
  #top .grow { flex:1; }
  button { font:inherit; color:var(--text); background:#1e2a42; border:1px solid #31425f; border-radius:9px; padding:7px 10px; cursor:pointer; }
  button:active { transform:translateY(1px); }
  button.primary { background:#1f7a52; border-color:#2a9b69; font-weight:600; }
  button.danger { background:#7a2420; border-color:#a5332d; }
  button:disabled { opacity:.45; }
  #panel { position:fixed; left:0; right:0; bottom:0; max-height:46vh; overflow:auto; z-index:5;
    background:rgba(19,28,46,.96); border-top:1px solid var(--line); padding:10px 12px calc(env(safe-area-inset-bottom) + 10px); }
  #panel:empty { display:none; }
  #panel h3 { margin:0 0 4px; font-size:16px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  #panel .sub { color:var(--mute); font-size:12.5px; margin-bottom:6px; }
  .row { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:6px; margin-top:6px; }
  .bcard { display:flex; flex-direction:column; align-items:flex-start; gap:1px; padding:6px 8px; text-align:left; }
  .bcard small { color:var(--mute); font-size:11px; }
  .dot { width:12px; height:12px; border-radius:50%; display:inline-block; border:1px solid #0008; }
  .pill { display:inline-block; padding:1px 7px; border-radius:99px; background:#24324d; font-size:12px; color:var(--mute); margin:0 4px 3px 0; }
  .bar { height:6px; background:#0b1220; border-radius:9px; overflow:hidden; margin:4px 0 2px; }
  .bar i { display:block; height:100%; background:#7fcf5a; }
  .preview { margin-top:8px; padding:8px; border:1px solid #6b2a26; background:#2a1414; border-radius:9px; }
  #modal { position:fixed; inset:0; z-index:10; background:rgba(5,9,18,.82); display:flex; align-items:center; justify-content:center; padding:14px; }
  #modal.hidden { display:none; }
  #modal .box { background:var(--panel); border:1px solid var(--line); border-radius:14px; width:min(520px,100%); max-height:92vh; overflow:auto; padding:16px; }
  #modal h1 { margin:0 0 4px; font-size:24px; letter-spacing:.5px; }
  #modal h2 { margin:14px 0 6px; font-size:13px; color:var(--mute); text-transform:uppercase; letter-spacing:1px; }
  .seg { display:flex; gap:6px; flex-wrap:wrap; }
  .seg button.on { background:#2a4f86; border-color:#4a7cc4; }
  .tech { border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin-bottom:6px; display:flex; gap:10px; align-items:center; }
  .tech .info { flex:1; }
  .tech .info b { display:block; }
  .tech .info small { color:var(--mute); }
  .tech.owned { border-color:#2a9b69; background:#12261d; }
  #toast { position:fixed; left:50%; top:calc(env(safe-area-inset-top) + 56px); transform:translateX(-50%); z-index:8; pointer-events:none;
    display:flex; flex-direction:column; gap:4px; align-items:center; width:92%; }
  #toast div { background:rgba(19,28,46,.95); border:1px solid var(--line); padding:6px 12px; border-radius:99px; font-size:13px; animation:fade 3.2s forwards; text-align:center; }
  @keyframes fade { 0%{opacity:0;transform:translateY(-6px)} 8%{opacity:1;transform:none} 80%{opacity:1} 100%{opacity:0} }
  #zoom { position:fixed; right:8px; z-index:4; display:flex; flex-direction:column; gap:6px; top:calc(env(safe-area-inset-top) + 58px); }
  #zoom button { width:38px; height:38px; padding:0; font-size:18px; }
  #busy { position:fixed; left:8px; top:calc(env(safe-area-inset-top) + 58px); z-index:4; padding:5px 10px; border-radius:99px; background:#2a1414; border:1px solid #6b2a26; font-size:12.5px; display:none; }
  p { margin:6px 0; }
  ul { margin:6px 0; padding-left:20px; }
  li { margin:3px 0; }
</style>

<body>
<canvas id="cv"></canvas>
<div id="top">
  <span class="stat" id="tTurn">Turn 1</span>
  <span class="stat" id="tSupply">⛽ 0</span>

<script>
'use strict';
/* =========================================================
   IRON FRONT: THEATER COMMAND
   An original turn-based modern-warfare strategy game.
   Author: 🎯
   ========================================================= */

const HEX = 30, SQ3 = Math.sqrt(3);
const PCOL = ['#2f7de1', '#e0453a', '#e8a317', '#9b4fd6'];
const PNAME = ['Blue Coalition', 'Red Pact', 'Gold Union', 'Violet Bloc'];
const TOWN_NAMES = ['Kessel','Ardena','Vostrel','Marrow','Halden','Tarsk','Bresk','Olvan','Corva','Dunmere','Esker','Fallow',
  'Garnet','Hollis','Iver','Jarrow','Kirin','Lomax','Mirov','Norrland','Osk','Pell','Quorin','Rask','Sable','Tamsin','Ulric',
  'Varga','Wexley','Yarrow','Zenda','Arlo','Brennan','Calder','Drava','Elgin','Ferris','Grosvald','Harlan','Istra','Juno',
  'Kestrel','Linden','Morrow','Nessa','Orrin','Pavla','Ridge','Stellan','Torvik'];

const TERRAIN = {
  plain:    { name:'Plains',        color:'#7fae62', def:1,    land:true  },
  desert:   { name:'Desert',        color:'#d6c189', def:1,    land:true  },
  forest:   { name:'Forest',        color:'#4f8042', def:1.25, land:true  },
  hill:     { name:'Hills',         color:'#a99d62', def:1.5,  land:true  },
  mountain: { name:'Mountains',     color:'#8c8f94', def:2,    land:true  },
  shallow:  { name:'Coastal Water', color:'#4c9fc6', def:1,    land:false },
  ocean:    { name:'Deep Ocean',    color:'#215f8f', def:1,    land:false },
};
const RES = {
  wheat: { name:'Wheat', icon:'🌾' },
  iron:  { name:'Iron',  icon:'🔩' },
  gold:  { name:'Gold',  icon:'🪙' },
  oil:   { name:'Oil',   icon:'🛢️' },
  fish:  { name:'Fish',  icon:'🐟' },
};

// air/orbit: damage multiplier vs aircraft / satellites (0 = cannot hit). ground: multiplier vs surface targets (default 1).
const UNITS = {
  infantry:  { name:'Infantry',        cost:3,  hp:10, atk:2,   def:2,   mv:1, rng:1, vis:2, dom:'land',  req:null,        cap:true, air:0.5,
               desc:'Cheap and steady. Captures cities. Can fire at low aircraft.' },
  worker:    { name:'Engineers',       cost:3,  hp:6,  atk:0,   def:1,   mv:2, rng:0, vis:2, dom:'land',  req:null,
               desc:'Build roads, farms, mines, lumber camps, derricks, fisheries and bridges.' },
  recon:     { name:'Recon Jeep',      cost:4,  hp:10, atk:1.5, def:1,   mv:3, rng:1, vis:3, dom:'land',  req:'motor',     cap:true,
               desc:'Fast scout with wide vision. Captures cities.' },
  tank:      { name:'Battle Tank',     cost:10, hp:20, atk:4,   def:3.5, mv:2, rng:1, vis:2, dom:'land',  req:'armor',     cap:true, heavy:true,
               desc:'Heavy armor. Cannot cross mountains or hit aircraft.' },
  artillery: { name:'Artillery',       cost:8,  hp:10, atk:4,   def:1,   mv:1, rng:3, minr:2, vis:2, dom:'land', req:'artillery', heavy:true,
               desc:'Shells targets 2–3 tiles away. Helpless up close.' },
  aa:        { name:'AA Battery',      cost:7,  hp:14, atk:2,   def:2.5, mv:1, rng:2, vis:3, dom:'land',  req:'artillery', heavy:true, air:2.5,
               desc:'Shreds aircraft within 2 tiles.' },
  transport: { name:'Transport Ship',  cost:5,  hp:10, atk:0,   def:1,   mv:3, rng:0, vis:2, dom:'naval', req:'seafaring', carry:2,
               desc:'Carries 2 land units. Move a unit next to it to board; select the ship to unload.' },
  destroyer: { name:'Destroyer',       cost:9,  hp:18, atk:3,   def:3,   mv:3, rng:2, vis:3, dom:'naval', req:'naval',     air:1, sonar:true,
               desc:'Fires 2 tiles. Sonar reveals subs within 2.' },
  submarine: { name:'Submarine',       cost:10, hp:12, atk:5,   def:1.5, mv:3, rng:1, vis:2, dom:'naval', req:'subs',      stealth:true,
               desc:'Invisible unless an enemy is adjacent or a destroyer is near.' },
  fighter:   { name:'Fighter Jet',     cost:12, hp:14, atk:3,   def:3,   mv:5, rng:1, vis:3, dom:'air',   req:'aviation',  air:2, ground:0.5,
               desc:'Air superiority. Flies over anything. Weak vs ground.' },
  bomber:    { name:'Bomber',          cost:14, hp:14, atk:5,   def:1,   mv:4, rng:1, vis:2, dom:'air',   req:'bombing',   air:0,
               desc:'Devastating vs ground and ships. Defenseless vs fighters.' },
  satellite: { name:'Recon Satellite', cost:16, hp:6,  atk:0,   def:1,   mv:4, rng:0, vis:5, dom:'orbit', req:'space',
               desc:'Launch reveals the whole map. Only Killer Satellites can hit it.' },
  strikesat: { name:'Orbital Cannon',  cost:10, hp:8,  atk:5,   def:1.5, mv:3, rng:1, minr:0, vis:5, dom:'orbit', req:'orbital', noBuild:true,
               desc:'Strikes ground or sea at or next to it. Recharges for 2 turns.' },
  killersat: { name:'Killer Satellite',cost:18, hp:10, atk:4,   def:2,   mv:4, rng:1, minr:0, vis:4, dom:'orbit', req:'spacecontrol', orbit:1.5, ground:0,
               desc:'Space control: hunts enemy satellites. Cannot hit the ground.' },
};

const TECH = {
  mining:      { name:'Mining',             base:5,  req:[],                      unlock:'Mines on hills (more ⛽ on iron and gold)' },
  motor:       { name:'Motor Pool',         base:6,  req:[],                      unlock:'Recon Jeep' },
  seafaring:   { name:'Seafaring',          base:5,  req:[],                      unlock:'Transport Ship, Fisheries' },
  artillery:   { name:'Fire Support',       base:8,  req:[],                      unlock:'Artillery, AA Battery' },
  engineering: { name:'Engineering',        base:7,  req:['mining'],              unlock:'Bridges over coastal water' },
  armor:       { name:'Armored Warfare',    base:10, req:['motor'],               unlock:'Battle Tank' },
  industry:    { name:'Oil Industry',       base:8,  req:['mining'],              unlock:'Oil Derricks (+3 ⛽)' },
  naval:       { name:'Naval Command',      base:8,  req:['seafaring'],           unlock:'Destroyer' },
  subs:        { name:'Submarine Warfare',  base:10, req:['naval'],               unlock:'Submarine' },
  aviation:    { name:'Air Force',          base:12, req:['motor','industry'],    unlock:'Fighter Jet' },
  bombing:     { name:'Strategic Bombing',  base:13, req:['aviation'],            unlock:'Bomber' },
  space:       { name:'Space Program',      base:18, req:['aviation'],            unlock:'Recon Satellite (reveals the map)' },
  orbital:     { name:'Orbital Cannon',     base:14, req:['space'],               unlock:'Upgrade satellites into Orbital Cannons' },
  spacecontrol:{ name:'Space Control',      base:16, req:['orbital'],             unlock:'Killer Satellites that destroy enemy satellites' },
};

const JOBS = {
  road:    { name:'Road',        turns:1, icon:'🛣️' },
  farm:    { name:'Farm',        turns:2, icon:'🌱' },
  lumber:  { name:'Lumber Camp', turns:2, icon:'🪓' },
  mine:    { name:'Mine',        turns:3, icon:'⛏️', tech:'mining' },
  derrick: { name:'Oil Derrick', turns:3, icon:'🛢️', tech:'industry' },
  fishery: { name:'Fishery',     turns:3, icon:'🎣', tech:'seafaring', adj:true },
  bridge:  { name:'Bridge',      turns:4, icon:'🌉', tech:'engineering', adj:true },
};

const DIFF = [
  { name:'Recruit', bonus:-1, attackMin:2.5, builds:1, research:0.35, peace:15 },
  { name:'Veteran', bonus:0,  attackMin:0.8, builds:2, research:0.55, peace:8 },
  { name:'General', bonus:2,  attackMin:0,   builds:99, research:0.8, peace:0 },
];

const DIRS = [[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]]; // axial, pointy-top: E, SE, SW, W, NW, NE
const UPGRADE_COST = 10, MAX_SATS = 3, MAX_LEVEL = 6;

/* ---------------- state ---------------- */
let S = null;
let visCache = {}, fieldCache = new Map(), occVer = -1;
const occMap = new Map();
let sel = null, reach = new Map(), tgts = [], pending = null, mode = null;
let busy = false, dirty = true;
const floats = [];
const cam = { x:0, y:0, z:1 };

const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
const sleep = ms => new Promise(r => setTimeout(r, ms));

class Heap { // min-heap on [key, value]
  constructor() { this.a = []; }
  get size() { return this.a.length; }
  push(k, v) { const a = this.a; a.push([k, v]); let i = a.length - 1;
    while (i > 0) { const p = (i - 1) >> 1; if (a[p][0] <= a[i][0]) break; [a[p], a[i]] = [a[i], a[p]]; i = p; } }
  pop() { const a = this.a, top = a[0], last = a.pop();
    if (a.length) { a[0] = last; let i = 0;
      for (;;) { const l = 2 * i + 1, r = l + 1; let m = i;
        if (l < a.length && a[l][0] < a[m][0]) m = l; if (r < a.length && a[r][0] < a[m][0]) m = r;
        if (m === i) break; [a[m], a[i]] = [a[i], a[m]]; i = m; } }
    return top; }
}

/* ---------------- hex helpers ---------------- */
const idx = (c, r) => r * S.w + c;
const tileAt = (c, r) => (c < 0 || r < 0 || c >= S.w || r >= S.h) ? null : S.tiles[idx(c, r)];
const toAxial = (c, r) => [c - ((r - (r & 1)) >> 1), r];
const fromAxial = (q, r) => [q + ((r - (r & 1)) >> 1), r];
function neighbors(t) {
  const [q, r] = toAxial(t.c, t.r), out = [];
  for (const [dq, dr] of DIRS) { const [nc, nr] = fromAxial(q + dq, r + dr); out.push(tileAt(nc, nr)); }
  return out;
}
function dist(a, b) {
  const [q1, r1] = toAxial(a.c, a.r), [q2, r2] = toAxial(b.c, b.r);
  const dq = q1 - q2, dr = r1 - r2;
  return (Math.abs(dq) + Math.abs(dr) + Math.abs(dq + dr)) / 2;
}
function within(t, rad) {
  const out = [];
  for (let r = Math.max(0, t.r - rad); r <= Math.min(S.h - 1, t.r + rad); r++)
    for (let c = Math.max(0, t.c - rad - 1); c <= Math.min(S.w - 1, t.c + rad + 1); c++) {
      const x = S.tiles[idx(c, r)]; if (dist(t, x) <= rad) out.push(x);
    }
  return out;
}
const hexPos = (c, r) => [HEX * SQ3 * (c + 0.5 * (r & 1)) + HEX, HEX * 1.5 * r + HEX];

/* ---------------- lookups ---------------- */
const tileOf = o => S.tiles[idx(o.c, o.r)];
const layerOf = u => UNITS[u.type].dom === 'orbit' ? 'orbit' : 'surface';
const unitById = id => S.units.find(u => u.id === id);
function unitAt(t, layer = 'surface') {
  if (occVer !== S.ver) { occMap.clear(); for (const u of S.units) occMap.set((layerOf(u) === 'orbit' ? 'o' : 's') + idx(u.c, u.r), u); occVer = S.ver; }
  return occMap.get((layer === 'orbit' ? 'o' : 's') + t.i) || null;
}
const cityAt = t => t.city >= 0 ? S.cities[t.city] : null;
const citiesOf = p => S.cities.filter(c => c.owner === p);
const unitsOf = p => S.units.filter(u => u.owner === p);
const ownerOf = t => t.claim >= 0 ? S.cities[t.claim].owner : -1;
const isWater = t => !TERRAIN[t.t].land;
const isLand = t => TERRAIN[t.t].land;
const hasRoad = t => t.road || t.bridge || t.city >= 0;
const isCoastal = city => neighbors(tileOf(city)).some(n => n && isWater(n));
const has = (p, k) => S.players[p].tech.includes(k);
const bump = () => { S.ver++; dirty = true; };
const diff = () => DIFF[S.diff];

function tileYield(t) {
  const y = { food:0, supply:0 };
  if (t.imp === 'farm') y.food = 1 + (t.res === 'wheat' ? 1 : 0);
  if (t.imp === 'fishery') y.food = 2;
  if (t.imp === 'lumber') y.supply = 1;
  if (t.imp === 'mine') y.supply = 1 + (t.res === 'iron' ? 1 : 0) + (t.res === 'gold' ? 2 : 0);
  if (t.imp === 'derrick') y.supply = 3;
  return y;
}
function foodRate(c) { let f = 1; for (const t of S.tiles) if (t.claim === c.id) f += tileYield(t).food; return f; }
const growNeed = c => 2 + 3 * c.level;
function cityIncome(c) { return 1 + c.level + (c.capital ? 2 : 0); }
function income(p) {
  let s = 0;
  for (const c of citiesOf(p)) s += cityIncome(c);
  for (const t of S.tiles) if (t.imp && ownerOf(t) === p) s += tileYield(t).supply;
  if (S.players[p].ai) s += diff().bonus;
  return Math.max(1, s);
}
const unitCap = p => citiesOf(p).reduce((a, c) => a + c.level + 2, 0);
const unitCount = p => unitsOf(p).reduce((a, u) => a + (UNITS[u.type].dom === 'orbit' ? 0 : 1 + (u.cargo ? u.cargo.length : 0)), 0);
const satCount = p => unitsOf(p).filter(u => UNITS[u.type].dom === 'orbit').length;
const techCost = (p, k) => TECH[k].base + 3 * Math.max(0, citiesOf(p).length - 1);
const techReady = (p, k) => TECH[k].req.every(r => has(p, r));

/* ---------------- map generation ---------------- */
function makeNoise(w, h, cell) {
  const gw = Math.ceil(w / cell) + 3, gh = Math.ceil(h / cell) + 3, g = [];
  for (let i = 0; i < gw * gh; i++) g.push(Math.random());
  return (x, y) => {
    const fx = x / cell, fy = y / cell, x0 = Math.floor(fx), y0 = Math.floor(fy);
    const tx = fx - x0, ty = fy - y0, sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
    const v = (a, b) => g[b * gw + a];
    const a = v(x0, y0) * (1 - sx) + v(x0 + 1, y0) * sx, b = v(x0, y0 + 1) * (1 - sx) + v(x0 + 1, y0 + 1) * sx;
    return a * (1 - sy) + b * sy;
  };
}
function blankTile(c, r, w) { return { c, r, i: r * w + c, t:'ocean', res:null, imp:null, road:false, bridge:false, city:-1, claim:-1 }; }
function addShallows() { for (const t of S.tiles) if (t.t === 'ocean' && neighbors(t).some(n => n && isLand(n))) t.t = 'shallow'; }
function sprinkleResources() {
  for (const t of S.tiles) {
    if (t.city >= 0) continue;
    const r = Math.random();
    if (t.t === 'plain') t.res = r < 0.12 ? 'wheat' : r < 0.16 ? 'oil' : null;
    else if (t.t === 'desert') t.res = r < 0.16 ? 'oil' : null;
    else if (t.t === 'hill') t.res = r < 0.16 ? 'iron' : r < 0.22 ? 'gold' : r < 0.26 ? 'oil' : null;
    else if (t.t === 'mountain') t.res = r < 0.12 ? 'gold' : null;
    else if (t.t === 'shallow') t.res = r < 0.14 ? 'fish' : null;
  }
}
function addCity(t, owner, capital, name) {
  const id = S.cities.length;
  S.cities.push({ id, c:t.c, r:t.r, name, owner, level: capital ? 2 : 1, capital, built:false, food:0 });
  t.city = id; t.res = null; if (t.t === 'mountain' || t.t === 'forest') t.t = 'plain';
}
function landComponents() {
  const seen = new Uint8Array(S.tiles.length), comps = [];
  for (const t of S.tiles) {
    if (seen[t.i] || !isLand(t)) continue;
    const comp = [], st = [t]; seen[t.i] = 1;
    while (st.length) { const x = st.pop(); comp.push(x); for (const n of neighbors(x)) if (n && !seen[n.i] && isLand(n)) { seen[n.i] = 1; st.push(n); } }
    comps.push(comp);
  }
  return comps.sort((a, b) => b.length - a.length);
}

function generateRandom(w, h, nPlayers) {
  for (let attempt = 0; attempt < 60; attempt++) {
    S.w = w; S.h = h; S.tiles = []; S.cities = [];
    const n1 = makeNoise(w, h, 5), n2 = makeNoise(w, h, 2.2), n3 = makeNoise(w, h, 3), n4 = makeNoise(w, h, 4);
    const elev = [], fv = [], dv = [];
    for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) {

function generateEarth(key, nPlayers) {
  const E = EARTH[key], w = E.w, h = E.h;
  S.w = w; S.h = h; S.tiles = []; S.cities = [];
  const n1 = makeNoise(w, h, 2.5), n2 = makeNoise(w, h, 3);
  const lonOf = (c, r) => E.lon[0] + (c + 0.5 + 0.5 * (r & 1)) / (w + 0.5) * (E.lon[1] - E.lon[0]);
  const latOf = r => E.lat[1] - (r + 0.5) / h * (E.lat[1] - E.lat[0]);
  for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) {
    const t = blankTile(c, r, w), lon = lonOf(c, r), lat = latOf(r);
    const land = E.land.some(p => inPoly(lon, lat, p)) && !E.water.some(p => inPoly(lon, lat, p));
    const x = c + 0.5 * (r & 1), y = r * 0.866;
    t.t = land ? E.terrain(lon, lat, n1(x, y), n2(x, y)) : 'ocean';
    S.tiles.push(t);
  }
  addShallows();
  const tileFor = (lon, lat) => {
    const r = Math.max(0, Math.min(h - 1, Math.round((E.lat[1] - lat) / (E.lat[1] - E.lat[0]) * h - 0.5)));
    const c = Math.max(0, Math.min(w - 1, Math.round((lon - E.lon[0]) / (E.lon[1] - E.lon[0]) * (w + 0.5) - 0.5 - 0.5 * (r & 1))));
    const t0 = S.tiles[idx(c, r)];
    const opts = within(t0, 1).filter(t => isLand(t) && t.city < 0 && S.cities.every(ct => dist(ct, t) >= 2))
      .sort((a, b) => dist(a, t0) - dist(b, t0) || (a.t === 'mountain') - (b.t === 'mountain'));
    return opts[0] || null;
  };
  const capNames = E.caps[nPlayers];
  capNames.forEach((nm, p) => { const d = E.cities.find(x => x[0] === nm); const t = tileFor(d[1], d[2]); addCity(t, p, true, nm); });
  for (const [nm, lon, lat] of E.cities) {
    if (capNames.includes(nm)) continue;
    const t = tileFor(lon, lat); if (t) addCity(t, -1, false, nm);
  }
  sprinkleResources();
  return true;
}

function recomputeTerritory() {
  for (const t of S.tiles) t.claim = -1;
  const order = [...S.cities].sort((a, b) => (b.capital - a.capital) || (b.level - a.level));
  for (const c of order) for (const t of within(tileOf(c), c.level >= 3 ? 2 : 1)) if (t.claim < 0 && (t.city < 0 || t.city === c.id)) t.claim = c.id;
}

      mode = { kind:'unload', tr:u.id, k:+b.dataset.k, tiles:new Set(unloadTiles(u).map(t => t.i)) }; dirty = true; refreshPanel();
    } else if (a === 'job') {
      const k = b.dataset.k, here = tileOf(u);
      if (JOBS[k].adj) {
        reach = new Map(); pending = null;
        mode = { kind:'job', job:k, w:u.id, tiles:new Set(neighbors(here).filter(n => n && jobOk(0, k, n, here)).map(t => t.i)) }; dirty = true; refreshPanel();
      } else { startJob(u, k, here); afterAction(u); }
    }
  } else if (sel.kind === 'city') {
    const c = S.cities[sel.id];
    if (a === 'build') { const u = build(0, c, b.dataset.k); if (u) toast(`${UNITS[u.type].name} ready in ${c.name} next turn`); refreshUI(); }
  }
});
function nextUnit() {
  const ready = unitsOf(0).filter(u => !u.job && (!u.moved || (!u.attacked && targetsFrom(u).length)));
  if (!ready.length) { toast('All units have acted — end your turn when ready'); return; }
  let i = 0;
  if (sel && sel.kind === 'unit') { const j = ready.findIndex(u => u.id === sel.id); if (j >= 0) i = (j + 1) % ready.length; }
  selectUnit(ready[i]); centerOn(tileOf(ready[i]));
}
$('bEnd').onclick = endTurn;
$('bNext').onclick = () => { if (!busy) nextUnit(); };
$('bTech').onclick = () => { if (!busy) showTech(); };
$('bMenu').onclick = () => showMenu();

/* ---------------- modals ---------------- */
const modal = $('modal'), mbox = $('mbox');
function openModal(html) { mbox.innerHTML = html; modal.classList.remove('hidden'); }
function closeModal() { modal.classList.add('hidden'); }
modal.addEventListener('click', e => { if (e.target === modal && S && !S.over) closeModal(); });

function showTech() {
  const P = S.players[0];
  let h = `<h1>🔬 Research</h1><div class="sub">You have ⛽ ${P.supply}. Costs rise as your empire grows.</div><h2>Doctrines</h2>`;
  for (const k of Object.keys(TECH)) {
    const T = TECH[k], owned = has(0, k), ready = techReady(0, k), cost = techCost(0, k);
    h += `<div class="tech ${owned ? 'owned' : ''}"><div class="info"><b>${T.name}</b><small>Unlocks: ${T.unlock}${T.req.length ? ' · Requires ' + T.req.map(r => TECH[r].name).join(' + ') : ''}</small></div>`;
    h += owned ? '✅' : `<button data-t="${k}" ${ready && P.supply >= cost && S.cur === 0 ? '' : 'disabled'}>${ready ? cost + ' ⛽' : '🔒'}</button>`;
    h += '</div>';
  }
  h += `<div class="row"><button id="mClose">Close</button></div>`;
  openModal(h);
  mbox.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { if (research(0, b.dataset.t)) { toast(`${TECH[b.dataset.t].name} researched`); refreshUI(); showTech(); } });
  $('mClose').onclick = closeModal;
}

const HELP = `
<h2>Goal</h2><p>Capture every enemy city. A faction with no cities is out.</p>
<h2>Economy</h2><ul>
<li>Cities earn <b>⛽ Supply</b> each turn. Bigger cities earn more and support more units.</li>
<li>Cities grow on <b>🌾 food</b>. Every city makes 1 food a turn; farms and fisheries in its territory add more.</li>
<li><b>Engineers</b> build: Roads (½ move cost), Farms (plains, +1 🌾, +2 on wheat), Lumber Camps (forest, +1 ⛽), Mines (hills, +1 ⛽, more on iron/gold), Oil Derricks (+3 ⛽), Fisheries (+2 🌾) and Bridges over coastal water.</li>
<li>Improvements only count inside your borders. Borders widen when a city reaches level 3.</li></ul>
<h2>Each turn</h2><ul>
<li>Tap a <b>unit</b>: white tiles show where it can move, red rings show what it can hit. Tap a ring to preview, tap again to fire.</li>
<li>A unit can move then attack. Attacking ends its turn.</li>
<li>Tap a <b>city</b> to build (one unit per city per turn).</li>
<li>Tap 🔬 to research doctrines: armor, artillery, navy, air force and space.</li></ul>
<h2>Crossing water</h2><p>Build a <b>Transport Ship</b> (Seafaring). Move a land unit onto the yellow ship tile to board. Select the ship and tap Unload to land troops on an adjacent shore. Or research Engineering and bridge narrow straits.</p>
<h2>Combat</h2><ul>
<li>Forest ×1.25, hills ×1.5, mountains ×2, own city ×1.5 defense.</li>
<li>Only Infantry, AA, Fighters and Destroyers can hit aircraft.</li>
<li>Submarines are invisible until an enemy is adjacent or a Destroyer is within 2 tiles.</li>
<li>Moving next to an armed enemy ground or naval unit stops your movement.</li>
<li>Units that rest heal next turn (most in your own cities).</li></ul>
<h2>Space race</h2><ul>
<li><b>Space Program</b>: launch a Recon Satellite — it reveals the whole map.</li>
<li><b>Orbital Cannon</b>: after 2 turns in orbit, upgrade a satellite to strike ground and sea targets.</li>
<li><b>Space Control</b>: Killer Satellites are the only thing that can destroy other satellites.</li></ul>
<h2>Controls</h2><p>Drag to pan, pinch or +/− to zoom. Tap a tile again to cycle between unit, satellite, city and terrain.</p>`;

let setup = { ai:1, size:16, diff:0, map:'random' };
function showStart() {
  let hasSave = false; try { hasSave = !!localStorage.getItem(SAVE_KEY); } catch (e) {}
  const seg = (key, vals) => `<div class="seg">${vals.map(([v, l]) => `<button data-s="${key}" data-v="${v}" class="${setup[key] === v ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  const capsInfo = setup.map !== 'random' ? `<div class="sub" style="margin-top:4px">You start in ${EARTH[setup.map].caps[setup.ai + 1][0]}; rivals in ${EARTH[setup.map].caps[setup.ai + 1].slice(1).join(', ')}.</div>` : '';
  openModal(`<h1>🪖 Iron Front</h1><div class="sub">Theater Command — a turn-based modern warfare strategy game.</div>
    <p>Grow your cities, develop farms, mines and oil, then build an army of infantry, tanks, ships, jets and satellites. Take every enemy city to win.</p>
    <h2>Map</h2>${seg('map', [['random', '🎲 Random'], ['usa', '🇺🇸 North America'], ['europe', '🇪🇺 Europe']])}${capsInfo}
    <h2>Opponents</h2>${seg('ai', [[1, '1'], [2, '2'], [3, '3']])}
    ${setup.map === 'random' ? `<h2>Map size</h2>${seg('size', [[12, 'Small'], [16, 'Medium'], [22, 'Large']])}` : ''}
    <h2>Difficulty</h2>${seg('diff', [[0, 'Recruit'], [1, 'Veteran'], [2, 'General']])}
    <div class="sub" style="margin-top:4px">${['Recruit: AI builds slowly and leaves you alone for the first 15 turns.', 'Veteran: a fair fight. 8 turns of peace.', 'General: AI gets bonus supply and attacks from turn 1.'][setup.diff]}</div>
    <div class="row" style="margin-top:16px"><button class="primary" id="mStart">▶ New game</button>${hasSave ? '<button id="mCont">Continue saved game</button>' : ''}<button id="mHelp">How to play</button><button id="mWatch">Watch AIs fight</button></div>`);
  mbox.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { const v = b.dataset.v; setup[b.dataset.s] = isNaN(+v) ? v : +v; showStart(); });
  $('mStart').onclick = () => newGame(setup);
  if (hasSave) $('mCont').onclick = () => { if (!load()) toast('Could not load save'); };
  $('mHelp').onclick = () => { openModal(`<h1>How to play</h1>${HELP}<div class="row"><button id="mBack">Back</button></div>`); $('mBack').onclick = showStart; };
  $('mWatch').onclick = () => newGame({ ...setup, spectate:true });
}
function showMenu() {
  if (!S) return showStart();
  openModal(`<h1>Menu</h1><div class="sub">Turn ${S.turn} · ${S.map === 'random' ? 'Random map' : EARTH[S.map].name} · ${DIFF[S.diff].name}</div>
    ${S.players.map(p => `<div class="tech"><span class="dot" style="background:${p.color}"></span><div class="info"><b>${p.name}${p.id === 0 && !S.spectate ? ' (you)' : ''}</b><small>${p.alive ? `${citiesOf(p.id).length} cities · ${unitsOf(p.id).length} units · ${p.tech.length} doctrines` : 'Eliminated'}</small></div></div>`).join('')}
    <div class="row"><button id="mResume" class="primary">Resume</button><button id="mHelp2">How to play</button><button id="mNew" class="danger">New game</button></div>`);
  $('mResume').onclick = closeModal;
  $('mHelp2').onclick = () => { openModal(`<h1>How to play</h1>${HELP}<div class="row"><button id="mBack">Back</button></div>`); $('mBack').onclick = closeModal; };
  $('mNew').onclick = () => {
    if (S.over || S.spectate) { S.over = true; return showStart(); }
    openModal(`<h1>Abandon this game?</h1><p>Your current war will be lost.</p><div class="row"><button id="mYes" class="danger">Abandon</button><button id="mNo">Keep playing</button></div>`);
    $('mYes').onclick = () => { S.over = true; try { localStorage.removeItem(SAVE_KEY); } catch (e) {} showStart(); };
    $('mNo').onclick = closeModal;
  };
}
function gameOver(win, winner) {
  S.over = true; busy = false; showBusy(''); try { localStorage.removeItem(SAVE_KEY); } catch (e) {} refreshUI();
  const title = S.spectate ? `${winner ? winner.name + ' wins' : 'Stalemate'}` : win ? '🏆 Victory!' : '☠️ Defeat';
  const msg = S.spectate ? `The war ended on turn ${S.turn}.` : win ? `You conquered the theater in ${S.turn} turns.` : 'Your last city has fallen.';
  openModal(`<h1>${title}</h1><p>${msg}</p><div class="row"><button class="primary" id="mAgain">New game</button><button id="mLook">View map</button></div>`);
  $('mAgain').onclick = showStart; $('mLook').onclick = closeModal;
}

window.__game = { get S() { return S; }, newGame, endTurn, UNITS, TECH, setFast: v => { if (S) S.fastAI = v; },
  t: { reachable, moveUnit, unload, spawn, startJob, startTurn, tileAt, neighbors, upgrade, targetsFrom, doAttack, jobOk, isWater, unitAt } };
showStart();
</script>
