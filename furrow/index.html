<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b2a33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="author" content="🎯">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Furrow to Skyline</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="view"></canvas>

<header id="hud">
  <div class="row1">
    <button id="cityName" class="city"></button>
    <span id="era" class="chip"></span>
    <span id="date" class="chip"></span>
    <div id="speed"><button data-s="0" aria-label="Pause">⏸</button><button data-s="1" aria-label="Normal">▶</button><button data-s="2" aria-label="Fast">⏩</button><button data-s="3" aria-label="Fastest">⏭</button></div>
  </div>
  <div class="row2">
    <span id="money" class="stat"></span><span id="pop" class="stat"></span><span id="food" class="stat"></span><span id="happy" class="stat"></span>
  </div>
</header>

<div id="rci" title="Demand: Residential, Commercial, Industrial">
  <div><i id="dR"></i><b>R</b></div><div><i id="dC"></i><b>C</b></div><div><i id="dI"></i><b>I</b></div>
</div>

<div id="side">
  <button id="bPeople" aria-label="People">👥<span class="badge"></span></button>
  <button id="bCouncil" aria-label="Council">🏛️<span class="badge"></span></button>
  <button id="bLetters" aria-label="Letters">✉️<span class="badge"></span></button>
  <button id="bOverlay" aria-label="Map views">🗺️</button>
  <button id="bFly" aria-label="Fly">🚁</button>
  <button id="bMenu" aria-label="Menu">☰</button>
</div>
<div id="zoom"><button id="zIn" aria-label="Zoom in">＋</button><button id="zOut" aria-label="Zoom out">－</button></div>

<div id="hint"></div>
<div id="tray"></div>
<nav id="toolbar"></nav>
<div id="toasts"></div>

<div id="sheetWrap" class="hidden">
  <div id="sheet">
    <div class="sheetHead"><h2 id="sheetTitle"></h2><button id="sheetClose" aria-label="Close">✕</button></div>
    <div id="sheetTabs"></div>
    <div id="sheetBody"></div>
  </div>
</div>

<div id="flyUI" class="hidden">
  <div id="flyInfo"><b id="flyWhere"></b><span id="flyAlt"></span></div>
  <div id="flyQuote" class="hidden"></div>
  <div id="joy"><div id="joyKnob"></div></div>
  <div id="flyBtns"><button id="flyUp" aria-label="Climb">⬆</button><button id="flyDown" aria-label="Descend">⬇</button><button id="flyExit">Land</button></div>
</div>

<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/sim.js"></script>
<script src="js/people.js"></script>
<script src="js/council.js"></script>
<script src="js/render.js"></script>
<script src="js/fly.js"></script>
<script src="js/input.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
